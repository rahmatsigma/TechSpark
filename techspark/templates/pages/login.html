{% extends 'pages/base_auth.html' %}
{% load static %}
{% load socialaccount %}

{% block title %}Login - TechSpark{% endblock %}

{% block content %}
<div class="login-container">
    <div class="logo">
        <h1>TechSpark</h1>
        <p>Masuk ke akun Anda</p>
    </div>
    <form id="loginForm" method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="login_field">Email atau Username</label>
            <input type="text" id="login_field" name="login_field" placeholder="nama@email.com atau admin" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-toggle">
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                <button type="button" onclick="togglePassword('password')">👁️</button>
            </div>
        </div>
        <div class="forgot-password">
            <a href="#forgot">Lupa password?</a>
        </div>
        <button type="submit" class="login-btn">Masuk</button>
    </form>
    <div class="divider">
        <span>atau masuk dengan</span>
    </div>
    <div class="social-login">
        <a href="{% provider_login_url 'google' %}" class="social-btn">
            <i class="bi bi-google"></i> Google
        </a>
        <a href="#" class="social-btn" onclick="alert('Fitur Facebook segera hadir!')">
            <i class="bi bi-facebook"></i> Facebook
        </a>
    </div>

</div> <script src="{% static 'js/login.js' %}"></script>
{% endblock %}
